name: Build and release patched Kotlin LSP

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Optional upstream version, such as 263.6379.0; blank selects newest'
        required: false
        type: string
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: kotlin-lsp-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 script/test-kotlin-lsp --self-test
      - name: Check Python syntax
        run: python3 -m py_compile script/release.py script/build-runtime script/test-kotlin-lsp script/test-android-kotlin-importer

  detect:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.detect.outputs.needed }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Find newest unreleased candidate
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        run: |
          arguments=(--repository "$RELEASE_REPOSITORY" --github-output "$GITHUB_OUTPUT")
          if [[ -n "$UPSTREAM_VERSION" ]]; then
            arguments+=(--version "$UPSTREAM_VERSION")
          fi
          python3 script/release.py discover "${arguments[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.detect.outputs.needed == 'true'
        with:
          name: build-plan
          path: plan.json
          if-no-files-found: error
          retention-days: 7

  compatibility:
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: build-plan
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Require patches to apply before starting a macOS build
        run: python3 script/build-runtime --plan plan.json --check-patches-only

  build:
    needs: [detect, compatibility]
    if: needs.detect.outputs.needed == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: build-plan
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install fixture Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build modified runtime
        id: runtime
        env:
          JAVA21_HOME: ${{ env.JAVA_HOME }}
        run: python3 script/build-runtime --plan plan.json
      - name: Test Android importer contract
        run: |
          python3 -m zipfile -e build/dependencies/gradle-9.6.1-bin.zip build/tools
          python3 script/test-android-kotlin-importer --gradle-home build/tools/gradle-9.6.1 --java-home "$JAVA_HOME"
      - name: Validate real Android import and LSP features
        env:
          SERVER: ${{ steps.runtime.outputs.server }}
          EXPECTED_RELEASE: ${{ needs.detect.outputs.version }}
        run: |
          mkdir -p build/fixture
          cp -R fixtures/android-ide/. build/fixture/
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > build/fixture/local.properties
          /bin/sh build/fixture/gradlew -p build/fixture :mobile:generateDemoDebugResources :mobile:generateFullDebugResources --no-daemon --no-configuration-cache
          for variant in demoDebug fullDebug; do
            python3 script/test-kotlin-lsp \
              --project build/fixture --server "$SERVER/bin/intellij-server" \
              --java-home "$JAVA_HOME" --expected-release "$EXPECTED_RELEASE" \
              --variant "$variant" --output "build/reports/$variant" \
              --timeout 600 --require-compose --require-original-sources --prepare-active-file
          done
      - name: Package validated server
        env:
          SERVER: ${{ steps.runtime.outputs.server }}
        run: python3 script/release.py package --plan plan.json --server "$SERVER" --reports build/reports
      - name: Preserve build and probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-evidence
          path: |
            plan.json
            build/reports/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [detect, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: release-assets
          path: dist
      - name: Upload all assets before making release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'script')
          from release import github
          release = github(f"repos/{os.environ['GH_REPO']}/releases/tags/{os.environ['RELEASE_TAG']}", missing_ok=True)
          if release is not None and not release['draft']:
              raise SystemExit('Release already published; refusing to overwrite it')
          if release is None:
              import subprocess
              subprocess.run(['gh', 'release', 'create', os.environ['RELEASE_TAG'], '--draft',
                              '--target', os.environ['BUILD_COMMIT'], '--title', os.environ['RELEASE_TAG'],
                              '--notes-file', 'dist/release-notes.md'], check=True)
          PY
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/runtime.json dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
